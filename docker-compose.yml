services:
  rtmp:
    image: alfg/nginx-rtmp:latest
    platform: linux/amd64
    entrypoint: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    container_name: rtmp-server
    ports:
      - "1935:1935"
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
